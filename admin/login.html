<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন গেটওয়ে | Crime Zoo</title>
  <link rel="icon" href="../assets/icons/logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/security.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.25rem;">
  <div class="form-card" style="width: 100%; max-width: 460px; margin: 0; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <img src="../assets/icons/logo.png" style="width: 76px; height: 76px; object-fit: contain; margin: 0 auto 0.75rem auto; border-radius: 14px; border: 1px solid rgba(220,38,38,0.45);">
      <h2 style="font-size: 1.55rem; color: #fff; font-weight: 800; margin-top: 0.35rem;">Crime Zoo সিকিউর গেটওয়ে</h2>
    </div>

    <!-- Permanent Lockout Banner -->
    <div id="deviceBlockedCurtain" style="display: none; background: rgba(220, 38, 38, 0.22); border: 2px solid #dc2626; border-radius: 12px; padding: 1.5rem; text-align: center; margin-bottom: 1.5rem;">
      <div style="font-size: 2.8rem; margin-bottom: 0.5rem;">🚫</div>
      <h3 style="color: #f87171; font-size: 1.2rem; font-weight: 800;">ডিভাইস চিরতরে লক করা হয়েছে</h3>
      <p style="color: #cbd5e1; font-size: 0.88rem; line-height: 1.6; margin-top: 0.5rem;">
        নিরাপত্তা নীতি লঙ্ঘন: ৫ বারের বেশি ভুল কোড দেওয়ার কারণে এই ডিভাইস থেকে এডমিন প্যানেল প্রবেশাধিকার চিরতরে বন্ধ করা হয়েছে।
      </p>
    </div>

    <div id="loginFormsContainer">
      <!-- STEP 1: Generic Clean Field (No Hints) -->
      <div id="step1Box">
        <form onsubmit="event.preventDefault(); submitStep1();">
          <div class="form-group">
            <label class="form-label">
              <span>সিকিউরিটি পাসকোড *</span>
              <span id="attemptWarning" style="font-size:0.75rem; color:#f87171;"></span>
            </label>
            <input type="password" id="adminPassInput" class="form-control" placeholder="পাসকোড লিখুন" required autofocus autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.88rem; margin-top: 0.5rem;">
            পরবর্তী ধাপ →
          </button>
        </form>
      </div>

      <!-- STEP 2: Running Digital Clock with Seconds (No Hints) -->
      <div id="step2TimeLockBox" style="display: none;">
        <div style="background: rgba(8, 12, 22, 0.95); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; text-align: center; margin-bottom: 1.35rem;">
          <div id="liveDigitalClock" style="font-size: 2rem; font-weight: 800; color: #38bdf8; font-family: 'Inter', monospace; letter-spacing: 2px;">
            00:00:00 AM
          </div>
        </div>

        <form onsubmit="event.preventDefault(); submitStep2TimeLock();">
          <div class="form-group">
            <label class="form-label">ভেরিফিকেশন কোড *</label>
            <input type="text" id="timeLockInput" class="form-control" placeholder="কোড লিখুন" style="text-transform: uppercase; font-weight: 700; letter-spacing: 2px; text-align: center; font-size: 1.15rem;" required autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.88rem; margin-top: 0.5rem;">
            প্রবেশ করুন
          </button>
        </form>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="../index.html" style="font-size: 0.84rem; color: var(--text-muted);">← মূল পাতায় ফিরে যান</a>
    </div>
  </div>

  <script src="../assets/js/mailer.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/security.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    function checkLockoutState() {
      if (typeof checkDeviceLockout === "function" && checkDeviceLockout()) {
        document.getElementById("deviceBlockedCurtain").style.display = "block";
        document.getElementById("loginFormsContainer").style.display = "none";
        return true;
      }
      return false;
    }
    checkLockoutState();

    // Running Digital Clock with Seconds (No hint text, just clock)
    function updateLiveClock() {
      const now = new Date();
      let h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      const hh = h < 10 ? "0" + h : "" + h;
      const mm = m < 10 ? "0" + m : "" + m;
      const ss = s < 10 ? "0" + s : "" + s;
      const clockEl = document.getElementById("liveDigitalClock");
      if (clockEl) {
        clockEl.innerText = `${hh}:${mm}:${ss} ${ampm}`;
      }
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function submitStep1() {
      if (checkLockoutState()) return;
      const val = document.getElementById("adminPassInput").value.trim();
      if (verifyAdminStep1(val)) {
        resetFailedAttempts();
        document.getElementById("step1Box").style.display = "none";
        document.getElementById("step2TimeLockBox").style.display = "block";
        updateLiveClock();
        document.getElementById("timeLockInput").focus();
      } else {
        const res = recordFailedAttempt();
        if (res.locked) {
          checkLockoutState();
          alert("সতর্কবার্তা: ৫ বার ভুল কোড দেওয়ার কারণে এই ডিভাইস চিরতরে ব্লক করা হলো!");
        } else {
          alert(`ভুল কোড! আর মাত্র ${res.remaining} বার চেষ্টা করতে পারবেন।`);
          document.getElementById("attemptWarning").innerText = `(${res.attempts}/৫)`;
        }
      }
    }

    function submitStep2TimeLock() {
      if (checkLockoutState()) return;
      const code = document.getElementById("timeLockInput").value.trim();
      if (verifyAdminStep2TimeLock(code)) {
        resetFailedAttempts();
        window.location.href = "index.html";
      } else {
        const res = recordFailedAttempt();
        if (res.locked) {
          checkLockoutState();
          alert("সতর্কবার্তা: ৫ বার ভুল কোড দেওয়ার কারণে এই ডিভাইস চিরতরে ব্লক করা হলো!");
        } else {
          alert(`ভেরিফিকেশন কোড মেলেনি! আর মাত্র ${res.remaining} বার চেষ্টা করতে পারবেন।`);
        }
      }
    }
  </script>
</body>
</html>
